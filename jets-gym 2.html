<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111318" />
<title>Jet's Gym</title>
<style>
:root{--bg:#0d0f13;--card:#171a21;--card2:#20242d;--text:#f5f7fb;--muted:#9ca4b4;--accent:#8fd3ff;--good:#89e6ad;--line:#303643;--warn:#ffd58a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.wrap{max-width:680px;margin:auto;padding:18px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 18px}.brand{font-weight:800;font-size:18px}.small{font-size:13px;color:var(--muted)}.hero{background:linear-gradient(145deg,#1a202a,#15181f);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}.eyebrow{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.12em}.hero h1{font-size:30px;line-height:1.05;margin:8px 0 8px}.hero p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 14px;font-weight:750;background:var(--card2);color:var(--text)}button.primary{background:var(--text);color:#101216}button.ghost{border:1px solid var(--line);background:transparent}.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0}.exhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.exname{font-size:18px;font-weight:800}.target{font-size:13px;color:var(--accent);font-weight:750;white-space:nowrap}.last{font-size:13px;color:var(--muted);margin:6px 0 12px}.sets{display:grid;gap:8px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 42px;gap:8px;align-items:center}.setno{color:var(--muted);font-size:13px}.field{display:flex;align-items:center;background:#0f1217;border:1px solid var(--line);border-radius:11px;padding:0 9px}.field input{width:100%;min-width:0;background:transparent;border:0;color:var(--text);padding:11px 2px;outline:none;font-size:16px}.unit{font-size:12px;color:var(--muted)}.tick{height:42px;padding:0;border-radius:11px;font-size:18px}.tick.done{background:var(--good);color:#0d1b12}.cue{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}.cue summary{cursor:pointer;color:#cbd1dc;font-size:13px;font-weight:700}.cue p{color:var(--muted);font-size:14px;line-height:1.45;margin:9px 0 0}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,19,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.bottomin{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}.bottom button{padding:14px}.view{display:none}.view.active{display:block}.listcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.listcard strong{display:block;margin-bottom:4px}.nav{display:flex;gap:7px}.nav button{padding:8px 10px;font-size:12px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px;margin-top:8px}.empty{color:var(--muted);text-align:center;padding:35px 10px}.note{font-size:12px;color:var(--muted);margin:10px 2px}.progress{height:5px;background:#262b35;border-radius:9px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:var(--accent);width:0}.danger{color:#ffaaa7}.sectionTitle{font-size:22px;margin:18px 2px 10px}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="brand">JET'S GYM</div><div class="small">8-week rolling A/B block</div></div><div class="nav"><button onclick="show('workout')">Train</button><button onclick="show('history')">History</button></div></div>
<div id="workout" class="view active"><div id="workoutContent"></div></div>
<div id="history" class="view"><h2 class="sectionTitle">History</h2><div id="historyContent"></div><button class="ghost danger" onclick="clearHistory()">Clear all history</button></div>
</div>
<div class="bottom" id="bottomBar"><div class="bottomin"><button class="ghost" onclick="changeWorkout()">Change</button><button class="primary" onclick="finishWorkout()">Finish workout →</button></div></div>
<script>
const sessions=[
{id:'U1A',name:'Upper 1A',sub:'V-taper + upper chest',ex:[
['Incline DB Press',3,'6–10','Bench 20–30°. Shoulder blades gently back/down. Deep controlled stretch; drive up and slightly inward.'],
['Neutral / Medium Pulldown',3,'6–10','Reach fully at the top and let the scapula move. Drive elbows toward hips; think long lats → elbows down.'],
['Chest-Supported DB Row',3,'8–12','Elbows 30–45°. Allow some protraction at the bottom, then pull through the upper back.'],
['Cable Lateral Raise',2,'10–15','Cable slightly behind you. Lead with the elbow; controlled long ROM.'],
['DB Shrug',2,'8–12','Let shoulders descend fully, then shrug straight up rather than rolling back. Pause at the top.'],
['Incline DB Curl',2,'8–12','Keep upper arm behind torso; full elbow extension without losing shoulder position.'],
['Cable Overhead Triceps Extension',2,'10–15','Let the triceps lengthen overhead; keep upper arms stable as you extend.']]},
{id:'L1A',name:'Lower 1A',sub:'Squat + adductors',ex:[
['Smith Squat',3,'6–10','Controlled deep ROM. Let knees travel naturally; stay balanced through the whole foot.'],
['Leg Curl',3,'8–12','Control the eccentric and squeeze hard in the shortened position.'],
['DB Bulgarian Split Squat',2,'8–10 / side','Use a comfortable long stride and get genuinely deep. Let the hip open under control.'],
['Cable Standing Adduction',2,'10–15 / side','Move from the hip without twisting the pelvis. Control the return into abduction.'],
['Leg Extension',2,'10–15','Smooth reps; hard quad contraction without kicking the weight.'],
['Smith Standing Calf Raise',3,'8–15','Full heel drop and ~2 sec stretch at the bottom; rise as high as possible.'],
['Copenhagen Plank',2,'20–40 sec / side','Stack ribs and pelvis; keep the supporting leg driving into the bench.']]},
{id:'U2A',name:'Upper 2A',sub:'Back + shoulders + scapular function',ex:[
['Pull-Up / Assisted Pull-Up',3,'6–10','Start from a full overhead reach; pull elbows down while keeping ribs controlled.'],
['Seated DB Overhead Press',3,'6–10','Press in a comfortable scapular plane; finish overhead without excessive lumbar extension.'],
['One-Arm Cable Row',3,'8–12 / side','Let the shoulder blade travel forward around the ribcage, then pull the elbow back.'],
['Cable Y-Raise',2,'10–15','Reach up and out; bias smooth upward rotation/lower trap rather than shrugging.'],
['Reverse Cable Fly',2,'12–20','Move through the rear delt/upper back without cranking the shoulders backward.'],
['DB Lateral Raise',2,'12–20','Controlled arc; stop before traps completely take over.'],
['Farmer Hold / Carry',2,'30–45 sec','Heavy DBs, tall posture, ribs stacked. Let traps and trunk work.'],
['Hammer Curl + Cable Pressdown',2,'10–15 each','Superset. Keep both movements clean and controlled.']]},
{id:'L2A',name:'Lower 2A',sub:'Posterior chain + athletic mobility',ex:[
['Romanian Deadlift',3,'6–10','Soft knees, hips back, long hamstrings. Stop where hip motion ends; keep the load close.'],
['Nordic Hamstring Curl',2,'5–8','Keep hips extended and lower under control. Use assistance as needed to preserve quality.'],
['45° Back Extension',3,'8–15','Fold at the hips; extend through glutes/hamstrings rather than hyperextending the low back.'],
['Lateral Lunge',2,'8–10 / side','Sit into one hip while the other leg lengthens. Use the adductor stretch under control.'],
['Leg Extension',2,'12–15','Smooth reps with a hard quad contraction.'],
['Bent-Knee Calf Raise',3,'12–20','Keep knee bent throughout to bias soleus; use full ankle ROM.'],
['Cable Pallof Press',2,'10–15 / side','Resist rotation; keep ribs stacked over pelvis.']]},
{id:'U1B',name:'Upper 1B',sub:'V-taper + upper chest',ex:[
['Incline DB Press',3,'6–10','Bench 20–30°. Shoulder blades gently back/down. Deep controlled stretch; drive up and slightly inward.'],
['Neutral / Medium Pulldown',3,'6–10','Reach fully at the top and let the scapula move. Drive elbows toward hips.'],
['Lean-Back Close-Grip Pulldown / Row',3,'8–12','Start more vertical in a lat stretch; lean back modestly as you pull toward lower chest/upper abdomen.'],
['Leaning DB Lateral Raise',2,'12–15','Use the lean to load the delt through a different range; keep the movement controlled.'],
['Cable Shrug',2,'10–15','Allow full depression, then shrug up strongly without rolling the shoulders.'],
['Bayesian Cable Curl',2,'10–15','Upper arm stays slightly behind the torso; control the long-length position.'],
['Cross-Body Cable Triceps Extension',2,'10–15','Keep the upper arm stable and extend fully across the body.']]},
{id:'L1B',name:'Lower 1B',sub:'Squat + adductors',ex:[
['Smith Squat',3,'6–10','Controlled deep ROM. Let knees travel naturally; stay balanced through the whole foot.'],
['Leg Curl',3,'8–12','Control the eccentric and squeeze hard in the shortened position.'],
['Cossack Squat',2,'6–10 / side','Sit into the adductor; control the bottom and progressively improve depth.'],
['Wide-Stance Smith Squat',2,'10–12','Moderate load, wider stance and deep controlled ROM to increase adductor contribution.'],
['Reverse DB Lunge',2,'8–12 / side','Step back smoothly; stay controlled through the front hip/knee.'],
['Single-Leg Calf Raise',3,'10–15 / side','Full stretch at bottom and full rise at top.'],
['Long-Lever Plank',2,'30–45 sec','Elbows slightly farther forward; squeeze glutes and keep ribs down.']]},
{id:'U2B',name:'Upper 2B',sub:'Back + shoulders + scapular function',ex:[
['Pull-Up / Assisted Pull-Up',3,'6–10','Start from a full overhead reach; pull elbows down while keeping ribs controlled.'],
['Seated DB Overhead Press',3,'6–10','Press in a comfortable scapular plane; finish overhead without excessive lumbar extension.'],
['Chest-Supported Wide-Elbow DB Row',3,'8–12','Drive elbows wider to bias upper back/rear delts; keep chest supported.'],
['Face Pull + External Rotation',2,'12–15','Pull toward face, then rotate smoothly without flaring ribs.'],
['Rear-Delt DB Fly',2,'12–20','Reach wide rather than excessively retracting the shoulder blades.'],
['Behind-Body Cable Lateral Raise',2,'10–15','Start cable behind the body; controlled long-length lateral-delt work.'],
['Smith Shrug',2,'8–12','Full shoulder depression, then shrug straight upward and pause.'],
['DB Concentration Curl + Overhead Triceps',2,'10–15 each','Superset; controlled reps and full comfortable ROM.']]},
{id:'L2B',name:'Lower 2B',sub:'Posterior chain + athletic mobility',ex:[
['Romanian Deadlift',3,'6–10','Soft knees, hips back, long hamstrings. Stop where hip motion ends; keep the load close.'],
['Nordic Hamstring Curl',2,'5–8','Keep hips extended and lower under control. Use assistance as needed.'],
['Reverse Hyperextension',3,'10–15','Smooth controlled reps; extend through the hips rather than swinging into lumbar extension.'],
['Deep Goblet Squat',2,'8–12','Light/moderate load. Sit deep and pause; use this as loaded hip/ankle mobility.'],
['Cable Adduction',2,'12–15 / side','Control both directions and keep the pelvis square.'],
['Straight-Knee Calf Raise',3,'10–15','Full stretch and full plantarflexion with the knee straight.'],
['Suitcase Carry / Hold',2,'30–45 sec / side','Stay tall and resist side-bending toward the weight.']]}
];
const optional={id:'D5',name:'Optional Day 5',sub:'Delts + traps + arms + mobility',ex:[
['Cable Lateral Raise',3,'12–20','Controlled long ROM.'],['Rear-Delt Fly',2,'15–20','Reach wide; keep neck relaxed.'],['Shrugs',3,'10–15','Full depression → strong vertical shrug.'],['Cable Pullover',2,'12–15','Long lat stretch; drive arms toward hips.'],['Biceps — choice',2,'10–15','Choose a curl you enjoy.'],['Triceps — choice',2,'10–15','Choose an extension that feels good.'],['Calves',3,'10–20','Full ROM.'],['Copenhagen / Cossack / Core — choose one',2,'Quality sets','Use this as movement-quality work, not punishment.']]};
let state=JSON.parse(localStorage.getItem('jetsGymState')||'null')||{idx:0,history:[],drafts:{}};
function save(){localStorage.setItem('jetsGymState',JSON.stringify(state))}
function current(){return sessions[state.idx%sessions.length]}
function lastFor(exName){for(let i=state.history.length-1;i>=0;i--){let e=state.history[i].results.find(x=>x.name===exName);if(e)return e}return null}
function fmtLast(e){if(!e)return 'No previous result yet';let s=e.sets.filter(x=>x.kg||x.reps).map(x=>`${x.kg||'—'}kg × ${x.reps||'—'}`).join(' · ');return s||'No result logged'}
function renderSession(s,isOptional=false){let d=state.drafts[s.id]||{};let html=`<div class="hero"><div class="eyebrow">${isOptional?'OPTIONAL SESSION':'NEXT WORKOUT'}</div><h1>${s.name}</h1><p>${s.sub}</p><div class="badge">${isOptional?'Does not advance the main queue':`${state.idx+1} of ${sessions.length} in rolling sequence`}</div><div class="progress"><span style="width:${((state.idx%sessions.length)+1)/sessions.length*100}%"></span></div></div>`;
 s.ex.forEach((x,ei)=>{let [name,n,target,cue]=x,last=lastFor(name),draft=d[ei]||[];html+=`<div class="exercise"><div class="exhead"><div class="exname">${name}</div><div class="target">${n} × ${target}</div></div><div class="last">Last: ${fmtLast(last)}</div><div class="sets">`;
 for(let si=0;si<n;si++){let z=draft[si]||{};html+=`<div class="setrow"><div class="setno">${si+1}</div><div class="field"><input inputmode="decimal" placeholder="kg" value="${z.kg||''}" oninput="edit('${s.id}',${ei},${si},'kg',this.value)"><span class="unit">kg</span></div><div class="field"><input inputmode="numeric" placeholder="reps" value="${z.reps||''}" oninput="edit('${s.id}',${ei},${si},'reps',this.value)"></div><button class="tick ${z.done?'done':''}" onclick="toggleDone('${s.id}',${ei},${si},this)">${z.done?'✓':'○'}</button></div>`}
 html+=`</div><details class="cue"><summary>Setup / motion / feel</summary><p>${cue}</p></details></div>`});return html}
function render(){document.getElementById('workoutContent').innerHTML=renderSession(current());renderHistory();document.getElementById('bottomBar').style.display=document.getElementById('workout').classList.contains('active')?'block':'none'}
function edit(id,e,s,k,v){state.drafts[id]=state.drafts[id]||{};state.drafts[id][e]=state.drafts[id][e]||[];state.drafts[id][e][s]=state.drafts[id][e][s]||{};state.drafts[id][e][s][k]=v;save()}
function toggleDone(id,e,s,b){state.drafts[id]=state.drafts[id]||{};state.drafts[id][e]=state.drafts[id][e]||[];state.drafts[id][e][s]=state.drafts[id][e][s]||{};let z=state.drafts[id][e][s];z.done=!z.done;b.classList.toggle('done',z.done);b.textContent=z.done?'✓':'○';save()}
function finishWorkout(){let s=current(),d=state.drafts[s.id]||{};let results=s.ex.map((x,ei)=>({name:x[0],sets:Array.from({length:x[1]},(_,si)=>((d[ei]||[])[si]||{}))}));state.history.push({date:new Date().toISOString(),session:s.name,results});delete state.drafts[s.id];state.idx=(state.idx+1)%sessions.length;save();window.scrollTo(0,0);render()}
function changeWorkout(){let names=sessions.map((s,i)=>`${i+1}. ${s.name}`).join('\n');let v=prompt(`Jump to a workout:\n${names}\n9. Optional Day 5`,String(state.idx+1));if(!v)return;let n=Number(v);if(n>=1&&n<=8){state.idx=n-1;save();render();window.scrollTo(0,0)}else if(n===9){document.getElementById('workoutContent').innerHTML=renderSession(optional,true);document.querySelector('.bottomin').innerHTML=`<button class="ghost" onclick="render();resetBottom()">← Main queue</button><button class="primary" onclick="finishOptional()">Save optional workout</button>`;window.scrollTo(0,0)}}
function resetBottom(){document.querySelector('.bottomin').innerHTML=`<button class="ghost" onclick="changeWorkout()">Change</button><button class="primary" onclick="finishWorkout()">Finish workout →</button>`}
function finishOptional(){let s=optional,d=state.drafts[s.id]||{};let results=s.ex.map((x,ei)=>({name:x[0],sets:Array.from({length:x[1]},(_,si)=>((d[ei]||[])[si]||{}))}));state.history.push({date:new Date().toISOString(),session:s.name,results});delete state.drafts[s.id];save();resetBottom();render();window.scrollTo(0,0)}
function renderHistory(){let el=document.getElementById('historyContent');if(!state.history.length){el.innerHTML='<div class="empty">No workouts logged yet.</div>';return}el.innerHTML=[...state.history].reverse().map(h=>{let d=new Date(h.date);let summary=h.results.map(e=>{let v=e.sets.filter(x=>x.kg||x.reps).map(x=>`${x.kg||'—'}×${x.reps||'—'}`).join(', ');return v?`<div class="small">${e.name}: ${v}</div>`:''}).join('');return `<div class="listcard"><strong>${h.session}</strong><div class="small">${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div>${summary}</div>`}).join('')}
function clearHistory(){if(confirm('Delete all saved workout history from this browser?')){state.history=[];save();renderHistory()}}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('bottomBar').style.display=id==='workout'?'block':'none';if(id==='workout'){resetBottom();render()}else renderHistory();window.scrollTo(0,0)}
render();
</script></body></html>
